<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nishanth V</title>
  <meta name="description" content="Software engineer. I build web things.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%232340C8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
  <style>
    :root {
      --paper: #F2F4F7;
      --ink: #16181D;
      --muted: #5B6170;
      --blue: #2340C8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14171D;
        --ink: #E7E9EE;
        --muted: #9AA1AE;
        --blue: #91A3FF;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--paper);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 100%;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    body {
      max-width: 38rem;
      padding: clamp(4rem, 18vh, 10rem) clamp(1rem, 6vw, 3rem) 4rem;
    }

    ::selection { background: var(--blue); color: var(--paper); }

    h1 {
      font-size: clamp(2.75rem, 11vw, 4.5rem);
      font-weight: 700;
      font-variation-settings: "opsz" 96;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .intro {
      margin-top: 1rem;
      font-size: 1.125rem;
      color: var(--muted);
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--blue);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 0.22em;
    }
    a:hover { color: var(--blue); }
    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .contact {
      list-style: none;
      margin-top: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nishanth V</h1>
    <p class="intro">Software engineer. I build web things.</p>

    <ul class="contact">
      <li><a href="https://github.com/iamnishanth">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/iamnishanth">LinkedIn</a></li>
      <li><a href="mailto:nishanthvenk68@gmail.com">Email</a></li>
    </ul>
  </main>
</body>
</html>
